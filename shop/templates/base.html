<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ key1 }}{% endblock %}</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f8f9fa;
            color: #2d3748;
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-align: center;
        }

        .tagline {
            text-align: center;
            font-size: 1.1rem;
            opacity: 0.95;
            margin-bottom: 2rem;
        }

        /* кнопки */
        .product-btn {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .product-btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        /* футер */
        footer {
            background: #2d3748;
            color: white;
            padding: 2rem 0;
            text-align: center;
            margin-top: 4rem;
        }

        footer p {
            opacity: 0.8;
        }

        /* detail page */
        .detail-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            background: white;
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }

        .detail-image img {
            width: 100%;
            border-radius: 12px;
        }

        .detail-title {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
        }

        .detail-category {
            color: #718096;
            margin-bottom: 0.75rem;
        }

        .detail-category span {
            color: #667eea;
            font-weight: 600;
        }

        .detail-price {
            font-size: 2rem;
            font-weight: 800;
            color: #667eea;
            margin-bottom: 1.5rem;
        }

        .detail-description {
            line-height: 1.7;
            margin-bottom: 2rem;
        }

        .detail-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .back-btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            background: #edf2f7;
            text-decoration: none;
            color: #2d3748;
            font-weight: 600;
        }

        .back-btn:hover {
            background: #e2e8f0;
        }

        @media (max-width: 768px) {
            .detail-wrapper {
                grid-template-columns: 1fr;
            }
        }
        /* Сетка товаров */
.products-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 2rem;
}

/* Карточка товара */
.product-card {
    background: white;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    transition: 0.3s;
    display: flex;
    flex-direction: column;
}

/* Hover эффект */
.product-card:hover {
    transform: translateY(-5px);
}

/* Картинка */
.product-image {
    width: 100%;
    height: 250px;
    object-fit: cover;
    display: block;
}

/* Информация внутри карточки */
.product-info {
    padding: 1rem;
    flex: 1;
    display: flex;
    flex-direction: column;
}

/* Кнопка всегда внизу */
.product-btn {
    margin-top: auto;
}
.cart-image img {
    width: 120px;
    height: 120px;
    object-fit: cover;
    border-radius: 10px;
}

.cart-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 10px 0;
}

.qty-btn {
    width: 35px;
    height: 35px;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
    font-weight: bold;
}

.qty-btn.plus {
    background: #4CAF50;
    color: white;
}

.qty-btn.minus {
    background: #f44336;
    color: white;
}

.qty-number {
    font-size: 18px;
    font-weight: 600;
    min-width: 30px;
    text-align: center;
}
}
    </style>

</head>
<body>

<header>
    <div class="container">
        <h1>{{ key1 }}</h1>
        <p class="tagline">Лучшие товары по выгодным ценам</p>
    </div>
</header>

{% block content %}{% endblock %}

<footer>
    <div class="container">
        <p>&copy; 2024 {{ key1 }}. Все права защищены.</p>
    </div>
</footer>

</body>
</html>
